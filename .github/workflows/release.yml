name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Criar release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Buscar tags
        run: git fetch --tags --force origin

      - name: Criar release no GitHub
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(tr -d ' \t\r\n' < VERSION)
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION invalida: ${VERSION}"
            exit 1
          fi

          TAG="v${VERSION}"
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            TAG="v${VERSION}-r${GITHUB_RUN_NUMBER}"
          fi

          ASSET=""
          if [ -f build/OneForAll.php ]; then
            ASSET="build/OneForAll.php"
          fi

          echo "Criando release ${TAG} a partir de ${GITHUB_SHA}"
          gh release create "$TAG" \
            --title "OneForAll ${TAG}" \
            --generate-notes \
            --target "$GITHUB_SHA" \
            ${ASSET}
